<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 - Not Found</title>
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="refresh" content="3; url=/">
    <link rel="icon" href="/assets/img/JIS-favicon.png" type="image/png">
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background: #0c0c0c url("/assets/img/404.png") center center / cover no-repeat fixed;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            margin: -1px;
            overflow: hidden;
            clip-path: inset(50%);
            white-space: nowrap;
        }

        .sr-only:focus-visible {
            width: auto;
            height: auto;
            margin: 0;
            padding: 8px 12px;
            top: 8px;
            left: 8px;
            clip-path: none;
            background: #f0f8ff;
            color: #0c0c0c;
        }
    </style>
    <script src="/assets/js/analytics.js" defer></script>
</head>

<body>
    <main>
        <h1 class="sr-only">404 - Page not found</h1>
        <a class="sr-only" href="/">Go to the home page</a>
    </main>
</body>

</html>
